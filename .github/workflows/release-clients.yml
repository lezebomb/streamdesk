name: Build Windows release
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: client-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - run: npm run desktop:build
      - name: Validate and publish built assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Existing release kept; bump version for a new release'; exit 0 }
          $installer = "artifacts/windows/StreamDesk-Setup-$version.exe"
          if (!(Test-Path $installer)) { throw 'Installer missing' }
          (Get-FileHash -Algorithm SHA256 $installer).Hash | Set-Content "$installer.sha256"
          gh release create $tag $installer "$installer.sha256" "$installer.blockmap" artifacts/windows/latest.yml --target $env:GITHUB_SHA --title "StreamDesk $version" --notes 'Windows installation build. Updates preserve user data. Personal source configuration is excluded; Android packages require the established private signing identity.'
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }
